{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card bg-white">
            <h3 class="text-center text-success mb-2">Sign Up</h3>
            <p class="text-center text-muted small">Enter your credentials below to create your account.</p>
            <hr>
            
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div>
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div style="color: red; font-size: 0.8rem; margin-top: -10px; margin-bottom: 10px;">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn-success">Create My Account</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{% url 'userlogin' %}" class="text-decoration-none small text-muted">Already have an account? <span style="color: #0d6efd; font-weight: 600;">Sign in here.</span></a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
