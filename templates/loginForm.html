{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card bg-white">
            <h3 class="text-center text-success mb-2" style="color: #0d6efd;">Sign In</h3>
            <p class="text-center text-muted small">Please enter your username and password to log in.</p>
            <hr>
            
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div>
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}
                <button type="submit" class="btn-success" style="background-color: #0d6efd;">Login</button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'registration' %}" class="text-decoration-none small text-muted">Don't have an account? <span style="color: #0d6efd; font-weight: 600;">Register here.</span></a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
