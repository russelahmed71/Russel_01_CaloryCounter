{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card bg-white">
            <h3 class="text-center text-success mb-2" style="color: #0d6efd;">Update Metrics</h3>
            <p class="text-center text-muted small">Change your profile data metrics loops below.</p>
            <hr>
            
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div>
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}
                <button type="submit" class="btn-success" style="background-color: #0d6efd;">Save Metrics</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
